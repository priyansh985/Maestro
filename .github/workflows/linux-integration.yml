# Linux OS-sandbox integration lane — DEFINED, NOT LOCALLY VERIFIED.
#
# Honesty note: this workflow was authored on a Windows host where neither
# Docker nor gVisor (runsc) is available. It is intended to run on GitHub's
# `ubuntu-latest` runners; it has NOT been executed here and is NOT a claim of
# production verification. The mocked tests in tests/test_sandbox_external.py
# remain the cross-platform contract; this lane adds the real-runtime evidence
# described in docs/V1_1_ROADMAP.md item 1 (the "first concrete step").
#
# Scope of this first step: real Docker isolation is smoke-tested; the gVisor
# gate only asserts that the real runsc binary is installed. Full `runsc run`
# guest execution and resource-cap evidence remain a follow-up, so this lane
# does not yet claim the roadmap's complete containment acceptance criteria.
name: Linux sandbox integration

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  sandbox-real-runtime:
    name: external sandbox (real docker + runsc)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Gated tests in tests/test_sandbox_external.py are skipped unless this
      # is set. The junit check below fails the job if any of them is skipped,
      # so a mock fallback can never be reported as real containment evidence.
      MAESTRO_SANDBOX_REAL: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - run: python -m pip install uv==0.12.2
      - run: uv sync --locked --extra dev --python 3.13

      - name: Verify Docker is available on the runner
        shell: bash
        run: |
          docker version
          docker pull python:3.11-slim

      - name: Install gVisor runsc
        shell: bash
        run: |
          set -euo pipefail
          # Install the official gVisor apt repository (signed) so the real
          # runsc binary, not a shim, is what the gVisor test path exercises.
          curl -fsSL https://gvisor.dev/archive.key \
            | gpg --dearmor | sudo tee /usr/share/keyrings/gvisor-archive-keyring.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/gvisor-archive-keyring.gpg arch=amd64] https://storage.googleapis.com/gvisor/releases release main" \
            | sudo tee /etc/apt/sources.list.d/gvisor.list
          sudo apt-get update
          sudo apt-get install -y runsc
          runsc --version

      - name: Real container smoke check (no network, read-only fs)
        shell: bash
        run: |
          set -euo pipefail
          out=$(docker run --rm --network=none --read-only python:3.11-slim \
            python -c "print('maestro-sandbox-smoke-ok')")
          test "$out" = "maestro-sandbox-smoke-ok"
          # Containment evidence: egress must fail under --network=none.
          if docker run --rm --network=none python:3.11-slim python -c \
            "import socket; socket.create_connection(('1.1.1.1', 53), timeout=2)"; then
            echo "ERROR: network egress unexpectedly succeeded under --network=none"
            exit 1
          fi
          echo "real container smoke check passed"

      - name: Sandbox contract tests (real runtimes, no mock fallback)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results/linux-integration
          .venv/bin/python -m pytest tests/test_sandbox_external.py -q -rs \
            --junitxml=results/linux-integration/sandbox-external.xml
          if grep -q '<skipped' results/linux-integration/sandbox-external.xml; then
            echo "ERROR: a real-sandbox test was skipped; mock fallback is not allowed here"
            exit 1
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: linux-sandbox-integration
          path: results/linux-integration/
          if-no-files-found: warn

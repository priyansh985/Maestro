# v1.1 item 4 -- Postgres RLS live seam: CI LANE SKELETON.
#
# This file DEFINES the live lane; it was NOT executed by the implementing agent
# (no Docker/Postgres available in the local environment). It provisions a real
# PostgreSQL 18 service and sets POSTGRES_DSN so the gated live smoke test in
# tests/test_postgres_rls.py actually runs here rather than skipping.
#
# Scope of the smoke test: the statements emitted by the new SQL splitter are
# accepted by a real server. Full RLS enforcement assertions (cross-tenant
# SELECT/INSERT/UPDATE/DELETE denied, missing context fails closed, pool reuse
# does not leak context) and the BYPASSRLS startup check remain follow-up work
# for this seam -- this lane is a foundation, not a claim that RLS is proven.

name: Postgres RLS integration

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/maestro/memory/postgres_rls.py"
      - "tests/test_postgres_rls.py"
      - ".github/workflows/postgres-integration.yml"
  push:
    branches: [main, development, 'codex/**']
    paths:
      - "src/maestro/memory/postgres_rls.py"
      - "tests/test_postgres_rls.py"
      - ".github/workflows/postgres-integration.yml"

permissions:
  contents: read

jobs:
  postgres-rls:
    name: Postgres RLS live seam (PostgreSQL 18)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: maestro
          POSTGRES_PASSWORD: maestro
          POSTGRES_DB: maestro
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U maestro -d maestro"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_DSN: postgresql://maestro:maestro@localhost:5432/maestro
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - run: python -m pip install uv==0.12.2
      - name: Install project with dev + postgres extras
        run: uv sync --locked --extra dev --extra postgres --python 3.13
      - name: Offline unit tests + gated live Postgres smoke
        run: >-
          .venv/bin/python -m pytest tests/test_postgres_rls.py -q
          --junitxml=results/postgres-rls.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: postgres-rls
          path: results/postgres-rls.xml
          if-no-files-found: warn

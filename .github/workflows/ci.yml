name: CI

on:
  push:
    branches: [main, development, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    name: offline evidence (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install uv==0.12.2
      - run: uv sync --locked --extra dev --python ${{ matrix.python }}
      - name: Collect all offline checks once
        run: .venv/bin/python -m maestro.scripts.validate_v1 --output-dir results/validation/ci --timeout-seconds 1800
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: offline-evidence-py${{ matrix.python }}
          path: results/validation/ci/
          if-no-files-found: warn

  windows-runner-contract:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python -m pip install uv==0.12.2
      - run: uv sync --locked --extra dev --python 3.13
      - run: .venv/Scripts/python -m pytest tests/test_validation_runner.py -q --junitxml=results/windows-contract.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: windows-runner-contract
          path: results/windows-contract.xml
          if-no-files-found: warn

  reproduction:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python -m pip install uv==0.12.2
      - run: uv sync --locked --python 3.13
      - name: Deterministic fixture reproduction (no live packet replay)
        run: .venv/bin/python -m maestro.experiments.runner
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: deterministic-reproduction
          path: |
            results/*.json
            results/*.csv
            results/*.md
          if-no-files-found: warn

  distribution:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MAESTRO_SIGNING_KEY: e0-wheel-smoke-test-only
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python -m pip install uv==0.12.2
      - name: Build wheel from sdist
        run: uv build --no-sources --python 3.13
      - name: Install wheel into a fresh environment and exercise resources outside checkout
        shell: bash
        run: |
          uv venv /tmp/maestro-wheel --python 3.13
          uv export --locked --no-dev --no-emit-project --format requirements-txt --output-file /tmp/runtime-requirements.txt
          uv pip sync --python /tmp/maestro-wheel/bin/python --require-hashes /tmp/runtime-requirements.txt
          uv pip install --python /tmp/maestro-wheel/bin/python --no-deps dist/*.whl
          uv pip check --python /tmp/maestro-wheel/bin/python
          uv pip freeze --python /tmp/maestro-wheel/bin/python > dist/runtime-installed.txt
          cd /tmp
          /tmp/maestro-wheel/bin/python "$GITHUB_WORKSPACE/scripts/wheel_smoke.py"
          /tmp/maestro-wheel/bin/maestro --help
          /tmp/maestro-wheel/bin/maestro --version
          /tmp/maestro-wheel/bin/maestro-v1-validate --help
          /tmp/maestro-wheel/bin/maestro-validate
          sha256sum "$GITHUB_WORKSPACE"/dist/* > "$GITHUB_WORKSPACE/dist/SHA256SUMS"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: warn

  image-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Resolve and record immutable base, then build
        shell: bash
        run: |
          mkdir -p results/image
          docker pull python:3.13-slim-bookworm
          base=$(docker image inspect python:3.13-slim-bookworm --format '{{index .RepoDigests 0}}')
          printf '%s\n' "$base" > results/image/base-digest.txt
          docker build --build-arg PYTHON_IMAGE="$base" --tag maestro:e0 .
          docker image inspect maestro:e0 --format '{{.Id}} {{.Config.User}}' > results/image/image-id-user.txt
      - name: Exercise installed image and production startup rejection
        shell: bash
        run: |
          docker run --rm -e MAESTRO_SIGNING_KEY=e0-image-smoke-only maestro:e0 python -c "import importlib.util,os; from maestro.config import load_config; from maestro.maestro.threats import load_threats; from maestro.server.app import app; assert os.getuid() == 10001; assert load_config().server.port; assert len(load_threats()) == 10; assert app.title; assert importlib.util.find_spec('pytest') is None"
          docker run --rm maestro:e0 maestro --version
          if docker run --rm -e MAESTRO_PROFILE=production maestro:e0 python -c 'import maestro.server.app'; then
            printf '%s\n' 'ERROR: production profile unexpectedly started'
            exit 1
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: image-metadata
          path: results/image/
          if-no-files-found: warn

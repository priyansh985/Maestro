# Threat-to-layer mapping + per-threat P, I, E (Sec 3.2 Table 1 + Sec 4.3 Table 4)
# Implements Eq. (1) R = P * I * E where each of P, I, E is on {1(Low), 2(Med), 3(High)}. risk_score must equal P*I*E.
# To verify: use `python -m maestro.scripts.validate_threats`.
threats:

    name: "Instruction Manipulation"            # Table 1 (input behavior manipulation) / Table 4 row 1
    table1_name: "Instruction Manipulation"
    table1_example: "Injected log entry modifies anomaly thresholding"
    table1_layers: ["L7", "ActionLayer"]        # Sec 3.2 Table 1: Perception + Action
    primary_layer: "L3"                          # Sec 4.3 Table 4: Agent Frameworks (L3)
    cross_layers: ["L2", "L5"]
    likelihood: "high"                            # Sec 4.3 Table 4: High
    impact: "medium"                             # Sec 4.3 Table 4: Medium
    exploitability: "medium"
    risk_score: 12
